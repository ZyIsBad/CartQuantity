<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartQuantity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="cart-box">

    <h1>Cart Quantity</h1>

    <p id="quantity">0</p>

    <div class="btnbox">

      <button onclick="

        console.log(`Cart quantity: ${cartQuantity}`)
        
      ">Show Quantity</button>

      <button onclick="

        cartQuantity ++;
        console.log(`Cart Quantity: ${cartQuantity}`);

      ">Add to Cart</button>

      <button onclick="

        cartQuantity +=2 ;
        console.log(`Cart Quantity: ${cartQuantity}`);

      ">+2</button>

      <button onclick="

        cartQuantity +=3 ;
        console.log(`Cart Quantity: ${cartQuantity}`);

      ">+3</button>

      <button onclick="

        cartQuantity +=4 ;
        console.log(`Cart Quantity: ${cartQuantity}`);

      ">+4</button>

      <button onclick="

        cartQuantity +=5 ;
        console.log(`Cart Quantity: ${cartQuantity}`);

      ">+5</button>

      <button onclick="

        cartQuantity -- ;
        console.log(`Cart Quantity: ${cartQuantity}`);

      ">-1</button>

      <button onclick="

        cartQuantity -=2 ;
        console.log(`Cart Quantity: ${cartQuantity}`);

      ">-2</button>

      <button onclick="

        cartQuantity -=3 ;
        console.log(`Cart Quantity: ${cartQuantity}`);

      ">-3</button>

      <button onclick="

        console.log(`Cart quantity: ${cartQuantity = 0}`)
        console.log('Cart was reset!')
      
      ">Reset Cart</button>

    </div>

  </div>

  <script>

    let cartQuantity = 0;

  </script>

</body>
</html>
